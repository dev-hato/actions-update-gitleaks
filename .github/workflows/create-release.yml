---
name: create-release
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-release.yml
      - scripts/action/**
      - action.yml
permissions:
  contents: write
jobs:
  create-release:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: dev-hato/actions-create-release@03c4598c582878251cc2808a2bb8d89d4d8fbb94 # v0.0.59
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
